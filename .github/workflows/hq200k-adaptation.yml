name: HQ200K local adaptation
on:
  pull_request:
    paths:
      - 'benchmarks/hq200k_adaptation.py'
      - 'hq200k_backend.py'
      - '.github/workflows/hq200k-adaptation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hq200k-adaptation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - run: PYTHONPATH=. python benchmarks/hq200k_adaptation.py --output adaptation-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: hq200k-adaptation-results
          path: adaptation-result.json
          retention-days: 14
