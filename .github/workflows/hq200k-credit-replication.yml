name: HQ200K R23 credit replication
on:
  pull_request:
    paths:
      - 'benchmarks/hq200k_credit_replication.py'
      - '.github/workflows/hq200k-credit-replication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [62601, 62602, 62603, 62604, 62605, 62606]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest -v benchmarks.test_hq200k_action_credit
      - run: python -u benchmarks/hq200k_credit_replication.py --seed ${{ matrix.seed }} --output credit.json
      - uses: actions/upload-artifact@v4
        with:
          name: credit-replication-${{ matrix.seed }}
          path: credit.json
          retention-days: 14
