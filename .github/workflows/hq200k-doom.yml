name: HQ200K real Doom smoke
on:
  pull_request:
    paths:
      - 'hq200k*'
      - 'genesis_neural_interface.py'
      - '.github/workflows/hq200k-doom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [structured, frozen, shuffled, zero, random]
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install 'numpy<3' 'tensorboard==2.20.0' opencv-python-headless
          python -m pip install 'vizdoom==1.3.0.dev2' || python -m pip install 'vizdoom==1.3.0'
          python -m pip freeze
      - name: Run bounded upstream PPO with real Doom
        run: |
          timeout 120s python -u hq200k_doom_smoke.py --arm "${{ matrix.arm }}" --batches 2 --output "smoke-${{ matrix.arm }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hq200k-doom-${{ matrix.arm }}
          path: smoke-${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 14
