name: HQ200K R15 paired retention evaluation
on:
  pull_request:
    paths:
      - 'hq200k_doom_smoke.py'
      - 'hq200k_backend.py'
      - 'benchmarks/hq200k_retention_report.py'
      - '.github/workflows/hq200k-training-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hq200k-training-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [37421, 37422, 37423]
        mode: [legacy, budgeted, frozen]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0
          python -m pip install numpy==2.4.6 tensorboard==2.20.0 opencv-python-headless==5.1.0.95 vizdoom==1.3.0.dev2
      - name: Train and evaluate in separate fresh processes
        env:
          MODE: ${{ matrix.mode }}
          SEED: ${{ matrix.seed }}
        run: |
          arm=structured
          rule="$MODE"
          if [ "$MODE" = frozen ]; then arm=frozen; rule=legacy; fi
          common=(--seed "$SEED" --stimulus-mode rate --excitation-gain 4 --inhibition-gain 8 --adaptation-strength 1 --plasticity-mode "$rule" --plasticity-budget 2 --episode-tics 512 --rollout-steps 64 --fixed-interface)
          mkdir -p pilot
          timeout 360s python -u hq200k_doom_smoke.py "${common[@]}" --arm "$arm" --batches 4 --save-weights --output pilot/train
          for eval_seed in 59101 59102; do
            timeout 180s python -u hq200k_doom_smoke.py "${common[@]}" --arm frozen --batches 2 --evaluation-seed "$eval_seed" --output "pilot/before-$eval_seed"
            timeout 180s python -u hq200k_doom_smoke.py "${common[@]}" --arm frozen --batches 2 --evaluation-seed "$eval_seed" --weights-path pilot/train/weights.npz --output "pilot/after-$eval_seed"
          done
          python benchmarks/hq200k_retention_report.py pilot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retention-${{ matrix.mode }}-${{ matrix.seed }}
          path: pilot/
          retention-days: 14
