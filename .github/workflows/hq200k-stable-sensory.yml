name: HQ200K R20 stable sensory dynamics
on:
  pull_request:
    paths:
      - 'benchmarks/hq200k_stable_sensory.py'
      - '.github/workflows/hq200k-stable-sensory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [59301, 59302, 59303]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - run: python -u benchmarks/hq200k_stable_sensory.py --seed ${{ matrix.seed }} --output stability.json
      - uses: actions/upload-artifact@v4
        with:
          name: stable-sensory-${{ matrix.seed }}
          path: stability.json
          retention-days: 14
