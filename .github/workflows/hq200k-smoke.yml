name: HQ200K CPU smoke
on:
  pull_request:
    paths:
      - 'hq200k*'
      - 'genesis_neural_interface.py'
      - 'test_*genesis*'
      - 'test_hq200k*'
      - '.github/workflows/hq200k-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<3'
      - run: python -m unittest -v test_genesis_neural_interface test_hq200k_backend
