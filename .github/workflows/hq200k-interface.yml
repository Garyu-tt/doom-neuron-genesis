name: HQ200K R19 interface verification
on:
  pull_request:
    paths:
      - 'hq200k_backend.py'
      - 'hq200k_doom_smoke.py'
      - 'test_hq200k_backend.py'
      - '.github/workflows/hq200k-interface.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - run: python -m py_compile hq200k_doom_smoke.py
      - run: python -m unittest -v test_hq200k_backend test_genesis_neural_interface
